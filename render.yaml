services:
  # CREST Render Blueprint (safe defaults, prompts for secrets).
  #
  # Notes:
  # - Keep secrets as sync:false so Render prompts you for them.
  # - Frontend and backend URLs vary per deploy; set them in Render env after deploy.
  # - Free-tier friendly: CREST_USE_DIRECT_INGEST=1 (no worker required).

  # 1) Backend API (FastAPI)
  - type: web
    name: crest-api
    env: docker
    dockerContext: .
    dockerfilePath: infra/docker/Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      # --- Runtime ---
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: "8000"

      # --- DB / Cache ---
      - key: CREST_DB_URL
        sync: false # REQUIRED: Render Postgres connection string
      - key: REDIS_URL
        sync: false # REQUIRED if Celery/Kafka paths are used; safe to set anyway

      # --- Feature flags ---
      - key: CREST_USE_DIRECT_INGEST
        value: "1"
      - key: CREST_USE_PGVECTOR
        value: "1"
      - key: EMBEDDING_MODE
        value: local
      - key: AUTO_APPROVE_DRAFTS
        value: "1"

      # --- Auth ---
      - key: JWT_SECRET_KEY
        generateValue: true

      # --- AI ---
      - key: GROQ_API_KEY
        sync: false # REQUIRED for live classification + drafts
      - key: OPENAI_API_KEY
        sync: false # OPTIONAL: used for Whisper STT (voice notes)

      # --- CORS / Public URLs ---
      - key: CORS_ALLOW_ALL
        value: "0"
      - key: CORS_ORIGINS
        sync: false # REQUIRED: set to your frontend origin(s), comma-separated
      - key: CREST_PORTAL_URL
        sync: false # REQUIRED: e.g. https://<your-crest-ui>.onrender.com
      - key: CREST_PUBLIC_API_URL
        sync: false # REQUIRED: e.g. https://<your-crest-api>.onrender.com (used for Twilio signature checks)

      # --- Twilio (WhatsApp/SMS) ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false # e.g. whatsapp:+14155238886
      - key: SMS_WEBHOOK_KEY
        sync: false

      # --- Instagram / Meta ---
      - key: INSTAGRAM_WEBHOOK_KEY
        value: "crest_instagram_demo_key_2026"
      - key: META_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_PAGE_ID
        sync: false

      # --- Discord ---
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false

      # --- Telegram ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      # --- Email ---
      - key: EMAIL_IMAP_USER
        sync: false
      - key: EMAIL_IMAP_PASSWORD
        sync: false
      - key: EMAIL_IMAP_HOST
        value: "imap.gmail.com"
      - key: EMAIL_SMTP_USER
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_SMTP_HOST
        value: "smtp.gmail.com"   # override with your SMTP host if not Gmail
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: EMAIL_SMTP_STARTTLS
        value: "1"
      - key: EMAIL_FROM_EMAIL
        sync: false               # REQUIRED: same as EMAIL_SMTP_USER for Gmail
      - key: EMAIL_FROM_NAME
        value: "CREST Support"

  # NOTE: The Discord Gateway Bot Listener was previously configured as a separate
  # worker service. To support Render Free Tier (which does not allow background workers),
  # the Discord listener now runs as an internal background asyncio task inside the
  # main crest-api service. No separate worker is required.


  # 2) Frontend UI (Next.js)
  - type: web
    name: crest-ui
    env: docker
    dockerContext: frontend/nextjs-app
    dockerfilePath: infra/docker/Dockerfile.nextjs
    plan: free
    buildArgs:
      # Baked into the Next.js bundle at build time — must match your backend URL.
      - key: NEXT_PUBLIC_API_URL
        sync: false # REQUIRED: https://<your-crest-api>.onrender.com
    envVars:
      # Runtime hostname binding — required for Render's internal router.
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      # Also expose at runtime so SSR server components can reach the API.
      - key: NEXT_PUBLIC_API_URL
        sync: false # REQUIRED: same value as the buildArg above
