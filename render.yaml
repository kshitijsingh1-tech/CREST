services:
  # 1. The Backend (FastAPI API + Celery Workers)
  - type: web
    name: crest-api
    env: docker
    dockerContext: .
    dockerfilePath: infra/docker/Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: CREST_DB_URL
        fromDatabase:
          name: crest-db
          property: connectionString
      - key: REDIS_URL
        # Set this manually to your Upstash URL in the Render UI
        sync: false 
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODE
        value: local

  # 2. The Frontend (Next.js UI)
  - type: web
    name: crest-ui
    env: docker
    dockerContext: .
    dockerfilePath: infra/docker/Dockerfile.nextjs
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: crest-api
          property: host

databases:
  - name: crest-db
    plan: free
    databaseName: crest
    user: crest_user
    # Note: Free databases are deleted after 90 days
